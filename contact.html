<form id="contact-form" action="https://formspree.io/f/mgonbjoo" method="POST" class="contact-form">
    <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>
    </div>
    <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="_replyto" required>
    </div>
    <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" required></textarea>
    </div>
    <button type="submit" id="submit-button">Send Message</button>
    <p id="status"></p> </form>

<script>
    // 1. Mobile menu toggle (Keeping your existing logic)
    const toggle = document.getElementById('mobile-menu-button');
    const menu = document.getElementById('nav-list');
    
    if(toggle && menu) {
        toggle.addEventListener('click', () => {
            menu.classList.toggle('active');
        });
    }

    // 2. Formspree AJAX Logic
    var form = document.getElementById("contact-form"); // ID matched to your form
    
    async function handleSubmit(event) {
      event.preventDefault();
      var status = document.getElementById("status");
      var data = new FormData(event.target);
      
      fetch(event.target.action, {
        method: form.method,
        body: data,
        headers: {
            'Accept': 'application/json'
        }
      }).then(response => {
        if (response.ok) {
          // Success: Redirect to thanks page
          window.location.href = "thanks.html"; 
        } else {
          response.json().then(data => {
            if (Object.hasOwn(data, 'errors')) {
              status.innerHTML = data["errors"].map(error => error["message"]).join(", ");
            } else {
              status.innerHTML = "Oops! There was a problem submitting your form";
            }
          })
        }
      }).catch(error => {
        status.innerHTML = "Oops! There was a problem submitting your form";
      });
    }
    form.addEventListener("submit", handleSubmit);
</script>
